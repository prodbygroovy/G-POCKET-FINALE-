name: Build G-POCKET

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Firma i plugin (Mac)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: |
          for p in build/*_artefacts/Release/VST3/G-POCKET.vst3 build/*_artefacts/Release/AU/G-POCKET.component build/*_artefacts/Release/Standalone/G-POCKET.app; do
            if [ -e "$p" ]; then
              chmod -R a+rX "$p"
              chmod +x "$p"/Contents/MacOS/*
              codesign --force --deep -s - "$p"
            fi
          done

      - name: Crea installer Mac (.pkg)
        if: runner.os == 'macOS'
        run: |
          chmod +x mac/pkg/make_pkg.sh mac/pkg/scripts/postinstall
          mac/pkg/make_pkg.sh build "G-POCKET_Installer_Mac.pkg" "1.0"

      - name: Upload installer Mac
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: G-POCKET-installer-mac
          path: G-POCKET_Installer_Mac.pkg

      - name: Upload Mac
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: G-POCKET-macos-latest
          path: |
            build/*_artefacts/Release/VST3
            build/*_artefacts/Release/AU
            build/*_artefacts/Release/Standalone

      - name: Upload Windows
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: G-POCKET-windows
          path: |
            build/*_artefacts/Release/VST3
            build/*_artefacts/Release/Standalone
